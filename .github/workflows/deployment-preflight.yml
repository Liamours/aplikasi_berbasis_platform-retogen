name: Deployment Preflight

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  deployment-preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Static deployment contract tests
        working-directory: backend
        run: uv run --with pytest pytest preflight_tests

      - name: Docker and frontend deployment preflight
        shell: pwsh
        run: ./scripts/deployment-preflight.ps1
